name: Refresh standings, fixtures and squads

on:
  schedule:
    - cron: "15 4 * * *"   # daily 04:15 UTC (06:15 CEST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/refresh.py
      - name: Commit if changed
        run: |
          git config user.name "footballclub-bot"
          git config user.email "bot@footballclub.wiki"
          git add public/data/snapshot.json public/data/rosters.json
          git diff --cached --quiet || git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
          git push
