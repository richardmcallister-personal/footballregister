<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grounds · footballclub.wiki</title>
<meta name="description" content="Every ground on one map: 236 clubs in Europe and North America, with each club's crest as its marker.">
<meta name="theme-color" content="#F8F6F1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=Public+Sans:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.css">
<link rel="stylesheet" href="/annual.css?v=1">
<script>try{const t=localStorage.getItem('ecr-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
main .wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;padding-block:20px 40px}
.plate{height:clamp(440px,74vh,820px)}
.hint{position:absolute;left:10px;top:10px;background:var(--paper);border:1px solid var(--border);padding:6px 10px;font-size:12.5px;color:var(--mute);pointer-events:none}
aside{min-width:0}
.entry{margin-top:18px}
@media (max-width:900px){main .wrap{grid-template-columns:1fr}.plate{height:clamp(380px,62vh,580px)}}
</style>
</head>
<body>
<header class="mast"><div class="wrap">
  <a class="brand" href="/">footballclub<i>.wiki</i></a>
  <div class="right">
    <nav class="top" aria-label="Sections"><a href="/">Leagues</a><a href="/grounds/" aria-current="page">Grounds</a></nav>
    <div class="tools"><button class="ghost" id="theme" type="button">Dark mode</button></div>
  </div>
</div></header>
<div class="bar"><div class="wrap">
  <div class="seg" role="group" aria-label="Region"><button id="rEU" type="button" aria-pressed="true">Europe</button><button id="rNA" type="button" aria-pressed="false">North America</button></div>
  <div class="chips" id="chips" role="group" aria-label="League"></div>
</div></div>
<main><div class="wrap">
  <section class="plate" aria-label="Map of grounds">
    <div class="map" id="map" role="region" aria-label="Map of grounds with club crests as markers"></div>
    <div class="hint" id="hint">Drag to move · scroll or pinch to zoom · tap a crest</div>
  </section>
  <aside>
    <div class="search"><label for="q" class="sr">Find a club, ground or city</label>
      <input id="q" type="search" placeholder="Find a club, ground or city" autocomplete="off">
      <ul class="results" id="results" hidden></ul></div>
    <div id="entry"><p class="empty">Loading 236 grounds…</p></div>
    <p class="note" style="margin-top:20px">Map tiles from OpenFreeMap, data © OpenStreetMap contributors. Next matches from ESPN when it can be reached, otherwise the daily snapshot.</p>
  </aside>
</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.js"></script>
<script src="/annual.js?v=1"></script>
<script>
(async function(){
  const $=s=>document.querySelector(s),esc=FCW.esc;
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let map;
  FCW.initTheme(()=>map&&map.retheme());
  const D=await FCW.load();
  const clubs=D.clubs.filter(c=>c.lat!=null&&c.lon!=null),byId=D.byId,L=D.L;
  const NA=c=>c.league==='usa.1';
  let region='eu',league='all',selected=null;
  const inRegion=c=>region==='na'?NA(c):!NA(c);

  function drawChips(){
    const chips=$('#chips');chips.innerHTML='';
    ['all',...FCW.ORDER.filter(k=>region==='na'?k==='usa.1':k!=='usa.1')].forEach(k=>{
      const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',String(league===k));
      b.innerHTML=esc(k==='all'?'All':L[k].name)+'<b>'+clubs.filter(c=>inRegion(c)&&(k==='all'||c.league===k)).length+'</b>';
      b.onclick=()=>{league=k;drawChips();FCW.dimLeague(map,league);fit(clubs.filter(c=>inRegion(c)&&(k==='all'||c.league===k)))};
      chips.appendChild(b)});
  }
  await FCW.loadCrests(clubs);
  map=FCW.makeMap('map',{clubs,onClick:id=>select(byId[id],false),onReady:()=>FCW.dimLeague(map,league)});
  map.once('movestart',()=>{$('#hint').hidden=true});

  const core=c=>NA(c)||c.lon>-11;
  function fit(list,instant){
    list=list.filter(core);if(!list.length)return;
    const b=new maplibregl.LngLatBounds();list.forEach(c=>b.extend([c.lon,c.lat]));
    map.fitBounds(b,{padding:40,maxZoom:12,duration:instant||still?0:900});
  }
  function paintRegion(){$('#rEU').setAttribute('aria-pressed',String(region==='eu'));$('#rNA').setAttribute('aria-pressed',String(region==='na'))}
  function setRegion(r){region=r;paintRegion();league='all';drawChips();FCW.dimLeague(map,league);fit(clubs.filter(inRegion))}
  $('#rEU').onclick=()=>setRegion('eu');$('#rNA').onclick=()=>setRegion('na');

  function select(c,fly){
    if(!c)return;
    if(!inRegion(c)){region=NA(c)?'na':'eu';paintRegion();league='all';drawChips();FCW.dimLeague(map,league)}
    selected=c;map.select(c.espn_id);
    $('#entry').innerHTML=`<article class="entry">${FCW.photoHTML(c)}${FCW.headHTML(D,c,'h1')}
      <p class="honours"><b>Honours</b> ${FCW.honours(D,c)}</p>
      ${FCW.factsHTML(D,c)}
      <h2 class="sec">Next match</h2>${FCW.nextHTML(D,c)}
      <h2 class="sec">Nearest grounds</h2>${FCW.nearHTML(D,c,false)}
      <div class="btns"><a class="pri" href="/club/#c${c.espn_id}">Open club page</a><button type="button" id="zoomHere">Zoom to the ground</button>${c.website?`<a href="${esc(c.website)}" target="_blank" rel="noopener">Club website</a>`:''}</div></article>`;
    $('#entry').querySelectorAll('.near button').forEach(b=>b.onclick=()=>select(byId[b.dataset.id],true));
    $('#zoomHere').onclick=()=>map.flyTo({center:[c.lon,c.lat],zoom:15.5,duration:still?0:1200});
    try{history.replaceState(null,'','#c'+c.espn_id)}catch(e){}
    if(fly)map.flyTo({center:[c.lon,c.lat],zoom:Math.max(map.getZoom(),11),duration:still?0:1000});
  }
  FCW.attachSearch(D,$('#q'),$('#results'),undefined,c=>select(c,true));

  const fromHash=(location.hash.match(/^#c(\d+)$/)||[])[1];
  const start=byId[fromHash]||clubs.find(c=>c.name==='Manchester United')||clubs[0];
  region=NA(start)?'na':'eu';paintRegion();drawChips();
  map.once('load',()=>fit(clubs.filter(inRegion),true));
  select(start,false);
  // next matches from ESPN for the open club
  FCW.refreshTeam(D,start.espn_id).then(()=>{if(selected===start)select(start,false)}).catch(()=>{});
})().catch(e=>{document.getElementById('entry').innerHTML='<p class="empty">The map didn’t load. Check your connection and reload the page.</p>';console.error(e)});
FCW.registerSW();
</script>
</body>
</html>
